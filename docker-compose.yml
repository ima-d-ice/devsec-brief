services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devsec_postgres
    environment:
      POSTGRES_USER: devsec
      POSTGRES_PASSWORD: devsec
      POSTGRES_DB: devsec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsec"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: devsec_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://devsec:devsec@postgres:5432/devsec
      - PRIMARY_MODEL=${PRIMARY_MODEL:-qwen/qwen3.8-27b}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-qwen/qwen3.6-27b}
      - SAFETY_NET_MODEL=${SAFETY_NET_MODEL:-openai/gpt-oss-120b}
      - GROQ_SERVE_KEYS=${GROQ_SERVE_KEYS:-1,2,3,4,5,6,7,8}
      - GROQ_GEN_KEYS=${GROQ_GEN_KEYS:-9,10}
      - GROQ_JUDGE_KEYS=${GROQ_JUDGE_KEYS:-11,12}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY_1=${GROQ_API_KEY_1}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2}
      - GROQ_API_KEY_3=${GROQ_API_KEY_3}
      - GROQ_API_KEY_4=${GROQ_API_KEY_4}
      - GROQ_API_KEY_5=${GROQ_API_KEY_5}
      - GROQ_API_KEY_6=${GROQ_API_KEY_6}
      - GROQ_API_KEY_7=${GROQ_API_KEY_7}
      - GROQ_API_KEY_8=${GROQ_API_KEY_8}
      - GROQ_API_KEY_9=${GROQ_API_KEY_9}
      - GROQ_API_KEY_10=${GROQ_API_KEY_10}
      - GROQ_API_KEY_11=${GROQ_API_KEY_11}
      - GROQ_API_KEY_12=${GROQ_API_KEY_12}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  eval:
    build: .
    profiles: ["eval"]
    container_name: devsec_eval
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://devsec:devsec@postgres:5432/devsec
      - PRIMARY_MODEL=${PRIMARY_MODEL:-qwen/qwen3.8-27b}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-qwen/qwen3.6-27b}
      - SAFETY_NET_MODEL=${SAFETY_NET_MODEL:-openai/gpt-oss-120b}
      - GROQ_SERVE_KEYS=${GROQ_SERVE_KEYS:-1,2,3,4,5,6,7,8}
      - GROQ_GEN_KEYS=${GROQ_GEN_KEYS:-9,10}
      - GROQ_JUDGE_KEYS=${GROQ_JUDGE_KEYS:-11,12}
      - GROQ_API_KEY_1=${GROQ_API_KEY_1}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2}
      - GROQ_API_KEY_3=${GROQ_API_KEY_3}
      - GROQ_API_KEY_4=${GROQ_API_KEY_4}
      - GROQ_API_KEY_5=${GROQ_API_KEY_5}
      - GROQ_API_KEY_6=${GROQ_API_KEY_6}
      - GROQ_API_KEY_7=${GROQ_API_KEY_7}
      - GROQ_API_KEY_8=${GROQ_API_KEY_8}
      - GROQ_API_KEY_9=${GROQ_API_KEY_9}
      - GROQ_API_KEY_10=${GROQ_API_KEY_10}
      - GROQ_API_KEY_11=${GROQ_API_KEY_11}
      - GROQ_API_KEY_12=${GROQ_API_KEY_12}
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "src.eval"]

volumes:
  pgdata:
