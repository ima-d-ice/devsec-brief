services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devsec_postgres
    environment:
      POSTGRES_USER: devsec
      POSTGRES_PASSWORD: devsec
      POSTGRES_DB: devsec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsec"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://devsec:devsec@postgres:5432/devsec
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY_4=${GROQ_API_KEY_4}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data

volumes:
  pgdata:
