global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: devsec-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Ingestion metrics live in the worker process, not the API process. Without
  # a separate scrape target the freshness alert would read an unset API gauge.
  - job_name: devsec-refresh
    metrics_path: /metrics
    static_configs:
      - targets: ["refresh:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
