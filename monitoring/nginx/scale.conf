log_format upstream '$remote_addr "$request" status=$status upstream=$upstream_addr rt=$request_time';
access_log /dev/stdout upstream;

upstream devsec_api {
    server api:8000 max_fails=3 fail_timeout=10s;
    server api2:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://devsec_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
