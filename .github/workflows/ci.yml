name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Ruff syntax/undefined-name gate
        run: ruff check src tests scripts --select E9,F63,F7,F82

      - name: Bytecode compilation check
        run: python -m py_compile src/*.py tests/*.py scripts/*.py scripts/failure/*.py

      - name: Unit tests
        run: |
          python -m pytest -m "not integration" -v --tb=short \
            --cov=src --cov-report=term-missing

  integration:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devsec
          POSTGRES_PASSWORD: devsec
          POSTGRES_DB: devsec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://devsec:devsec@localhost:5432/devsec
        run: python -m src.migrate

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://devsec:devsec@localhost:5432/devsec
        run: python -m pytest -m integration -v --tb=short

  compose-config:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate base stack
        run: docker compose config -q

      - name: Validate load-test profile
        run: docker compose --profile loadtest config -q

      - name: Validate scale overlay
        run: docker compose -f docker-compose.yml -f docker-compose.scale.yml --profile scale config -q

      - name: Validate replication overlay
        run: docker compose -f docker-compose.yml -f docker-compose.replication.yml --profile replication config -q

  security:
    name: Secret & Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert example environment file has no real secrets
        run: |
          if grep -E '^(GROQ_API_KEY(_[0-9]+)?|HF_TOKEN|GEMINI_API_KEY)=.+' .env.example; then
            echo "Sensitive .env.example entries must remain empty placeholders." >&2
            exit 1
          fi

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-dirs: devsec-brief-frontend/node_modules,devsec-brief-frontend/.next,node_modules,.git

  build:
    name: Image Build & Import Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: devsec-brief:ci
          cache-from: type=gha,scope=ci-build
          cache-to: type=gha,mode=max,scope=ci-build

      - name: Assert baked models
        run: |
          docker run --rm --entrypoint sh devsec-brief:ci -c \
            "test -f /app/data/onnx_st/bge-m3-onnx/onnx/model_qint8_arm64.onnx && \
             test -f /app/data/onnx_st/mmarco-onnx/onnx/model_qint8_arm64.onnx"

      - name: Import application (no DB connection at import)
        run: |
          docker run --rm --entrypoint python devsec-brief:ci -c \
            "import src.api; print('api-import-ok')"
