name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/ --output-format=github
      - run: ruff format --check src/ tests/ || echo "format check skipped"

  test:
    name: Test (pytest --cov)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r requirements-dev.txt
      - name: Run unit + existing tests (no DB)
        env:
          GROQ_API_KEY: gsk_dummy_for_ci
          LOG_JSON: "0"
          DATABASE_URL: postgresql://devsec:devsec@localhost:5432/devsec_test
        run: |
          pytest tests/unit tests/test_prompt_injection.py tests/test_api_validation.py -v --cov=src --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=55
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    name: Integration (pgvector)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devsec
          POSTGRES_PASSWORD: devsec
          POSTGRES_DB: devsec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r requirements-dev.txt
      - name: Run integration tests
        env:
          GROQ_API_KEY: gsk_dummy_for_ci
          DATABASE_URL: postgresql://devsec:devsec@localhost:5432/devsec
          LOG_JSON: "0"
        run: |
          pytest tests/integration -v --override-ini="addopts=" -m integration

  docker:
    name: Docker smoke (build + health)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache ONNX (avoid re-download)
        uses: actions/cache@v4
        with:
          path: data/onnx_st
          key: onnx-${{ hashFiles('src/export_st_onnx.py') }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            onnx-
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: devsec-brief:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — run container & curl /health
        env:
          GROQ_API_KEY: gsk_dummy_for_ci_docker_smoke
        run: |
          docker run -d --name devsec_smoke -p 8000:8000 -e GROQ_API_KEY=$GROQ_API_KEY devsec-brief:ci || (docker logs devsec_smoke; exit 1)
          # Wait for health (max 60s)
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8000/health; then echo "health ok"; break; fi
            echo "waiting $i..."
            sleep 5
          done
          curl -sf http://localhost:8000/health | grep -q "ok"
          # Cleanup
          docker logs devsec_smoke || true
          docker rm -f devsec_smoke
