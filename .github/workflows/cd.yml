name: CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

permissions:
  contents: read
  packages: write

# One delivery at a time per ref; never cancel a run that may be promoting.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      # Push by digest only: tagging happens once, after gates, in deliver.
      # NOTE: quantization stays on the arm64 profile for both arches so the
      # baked filename (model_qint8_arm64.onnx) matches what rag.py loads.
      # Per-arch AVX profiles are a follow-up, not a correctness issue.
      - name: Build & Push by Digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  deliver:
    name: Gate & Publish Multi-arch Manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devsec
          POSTGRES_PASSWORD: devsec
          POSTGRES_DB: devsec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Create & Push SHA Manifest
        id: manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          SHA_TAG="$IMAGE:sha-${{ github.sha }}"
          DIGESTS=""
          for f in /tmp/digests/*; do
            DIGESTS="$DIGESTS $IMAGE@sha256:$(basename "$f")"
          done
          echo "Merging:$DIGESTS"
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$SHA_TAG" $DIGESTS
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Assert Baked ONNX Models Present
        run: |
          docker run --rm --entrypoint sh "${{ steps.manifest.outputs.sha_tag }}" -c \
            "test -f /app/data/onnx_st/bge-m3-onnx/onnx/model_qint8_arm64.onnx && \
             test -f /app/data/onnx_st/mmarco-onnx/onnx/model_qint8_arm64.onnx && \
             echo 'baked ONNX models present'"

      - name: Smoke Test Container Boot & Health
        run: |
          IMAGE="${{ steps.manifest.outputs.sha_tag }}"
          echo "Smoking image: $IMAGE"
          # Host network: the container's localhost must be the runner's
          # localhost, where the postgres service port is mapped.
          docker run -d --name test_api --network host \
            -e DATABASE_URL=postgresql://devsec:devsec@localhost:5432/devsec \
            "$IMAGE"
          cleanup() { docker rm -f test_api; }
          trap cleanup EXIT
          # Models are baked in; boot is load + migrate only (~1-2 min)
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo; echo "Smoke test passed"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test FAILED: /health never returned 200"
          docker logs test_api
          exit 1

      - name: Scan Image for Critical CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.sha_tag }}
          format: table
          severity: CRITICAL
          # Fail only on fixable findings: base-image CVEs with no patch
          # available are re-checked every run instead of blocking delivery.
          ignore-unfixed: true
          # Skip 16MB tokenizer blobs: secret-scan memory warnings, no findings.
          skip-files: app/data/onnx_st/bge-m3-onnx/tokenizer.json,app/data/onnx_st/mmarco-onnx/tokenizer.json
          exit-code: '1'

      - name: Promote SHA Manifest to Release Tags
        run: |
          # Alias the gated manifest as latest/semver with zero rebuild.
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | sed 's/^/-t /' | tr '\n' ' ')
          echo "Promoting to: $TAGS"
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGS \
            "${{ steps.manifest.outputs.sha_tag }}"
