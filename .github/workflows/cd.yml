name: CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

permissions:
  contents: read
  packages: write

# One delivery at a time per ref; never cancel a run that may be promoting.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deliver:
    name: Build, Gate, Publish Container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devsec
          POSTGRES_PASSWORD: devsec
          POSTGRES_DB: devsec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=sha-{{sha}}

      - name: Build & Push SHA-tagged Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert Baked ONNX Models Present
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          docker run --rm --entrypoint sh "$IMAGE" -c \
            "test -f /app/data/onnx_st/bge-m3-onnx/onnx/model_qint8_arm64.onnx && \
             test -f /app/data/onnx_st/mmarco-onnx/onnx/model_qint8_arm64.onnx && \
             echo 'baked ONNX models present'"

      - name: Smoke Test Container Boot & Health
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          echo "Smoking image: $IMAGE"
          # Host network: the container's localhost must be the runner's
          # localhost, where the postgres service port is mapped.
          docker run -d --name test_api --network host \
            -e DATABASE_URL=postgresql://devsec:devsec@localhost:5432/devsec \
            "$IMAGE"
          cleanup() { docker rm -f test_api; }
          trap cleanup EXIT
          # Models are baked in; boot is load + migrate only (~1-2 min)
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo; echo "Smoke test passed"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test FAILED: /health never returned 200"
          docker logs test_api
          exit 1

      - name: Scan Image for Critical CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL
          # Fail only on fixable findings: base-image CVEs with no patch
          # available are re-checked every run instead of blocking delivery.
          ignore-unfixed: true
          # Skip 16MB tokenizer blobs: secret-scan memory warnings, no findings.
          skip-files: app/data/onnx_st/bge-m3-onnx/tokenizer.json,app/data/onnx_st/mmarco-onnx/tokenizer.json
          exit-code: '1'

      - name: Promote SHA Image to Release Tags
        run: |
          # Alias the gated SHA image as latest/semver with zero rebuild.
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | grep -v ':sha-' | sed 's/^/-t /' | tr '\n' ' ')
          echo "Promoting to: $TAGS"
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGS \
            "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
