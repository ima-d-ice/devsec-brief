# Optional two-replica API drill. The base stack remains single-replica.
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml \
#     --profile scale up -d api2 nginx
#
# The replicas share Postgres (cache and chat state). Per-process rate limits,
# Groq key cooldowns, and circuit breakers are intentionally not shared.
services:
  api2:
    extends:
      file: docker-compose.yml
      service: api
    container_name: devsec_api_2
    profiles: ["scale"]
    ports: !override
      - "127.0.0.1:${API2_PORT:-8010}:8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: devsec_nginx
    profiles: ["scale"]
    volumes:
      - ./monitoring/nginx/scale.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${LB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      api2:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
